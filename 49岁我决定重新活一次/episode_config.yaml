# ---- 角色音色锁定（正式成片只用人工录制，禁 AI 音色）----
voice_assets:
  林晚:
    spec: "女性 49岁 成熟/平静/生活感；对白自然克制，旁白更平静"
    dir: "EP01/05_配音/01_正式语音素材"
  丈夫:
    spec: "男性 51岁 克制/疏离；平静回避，不凶狠不霸总"
    dir: "EP01/05_配音/01_正式语音素材"
  forbidden:
    - "F5-TTS"
    - "Kokoro"
    - "edge-tts"
    - "任何其他 AI 合成音色"
  rule: "正式成片声音 = 剪映人工录制 WAV；AI 音色禁止进入成片"

# ---- 音频规则（强制）----
audio:
  src_sample_rate: 48000
  src_bit_depth: 16
  src_channels: 2            # 立体声
  master_sample_rate: 48000
  master_bit_depth: 16
  master_channels: 2
  normalize_peak_dbfs: -1.0  # 软限幅后归一到 0.89（实测 peak = 0.8900 = -1.01 dBFS）
  forbidden_input: "24kHz 单声道 AI 音频"
  trim_tail_silence: 0.20    # 裁尾保留静音秒数
  mix_bus: "单声道总线；剪映立体声 WAV 下混进总线（源文件不动）"

# ---- 视频 / 合成 ----
video:
  resolution: "1080x1920"
  fps: 24
  frames_per_shot: 121
  codec: "libx264"
  crf: 18
  audio_codec: "aac"
  audio_bitrate: "192k"
  # WorkBuddy 生成器水印坐标（换生成器须重新抽帧定位）
  delogo: {x: 830, y: 1840, w: 244, h: 78}
  # 注意：EP01 源视频为 1080x1916，须先 scale=1080:1920 再 delogo
  source_note: "EP01 源视频 1080x1916 → scale=1080:1920 (lanczos) → delogo → 烧字幕 → mux"

# ---- 目录结构（与模板第一节一致）----
directories:
  script: "01_剧本"
  storyboard: "02_分镜"
  keyframes: "03_首帧"
  video_shots: "04_视频镜头"
  voice: "05_配音/01_正式语音素材"
  audio_eng: "06_音频工程"
  subtitle: "07_字幕"
  roughcut: "08_粗剪预览"
  final: "09_最终成片"

# ---- 成片 QC 阈值 ----
qc:
  video_resolution: "1080x1920"
  audio_sample_rate: 48000
  audio_channels: 2
  audio_bit_depth: 16
  peak_dbfs_max: -1.0
  sync_tolerance_s: 0.2
  subtitle_rules:
    every_voice_has_subtitle: true
    every_subtitle_has_voice: true
    no_two_subtitles_same_position: true
    timeline_qc_before_export: true
  character_consistency: true
  file_integrity: true        # 帧数 = 镜头数×121，无缺镜乱序

# ---- EP01 实际 QC 结果（回填自 EP01_最终成片_v3.mp4 + mix/EP01_混音_48k.wav）----
qc_results:
  final_file: "EP01/09_最终成片/EP01_最终成片_v3.mp4"
  video_resolution: "1080x1920"
  frames: 1452
  duration_s: 60.50
  fps: 24
  frame_check: "pass — 12×121 = 1452 帧，SH01–12 顺序正确，无缺镜乱序"
  audio_sample_rate: 48000
  audio_channels: 2
  audio_bit_depth: 16
  peak_dbfs: -1.01
  longest_silence_s: 0.58     # RMS<0.005 实测；剧本设计停顿由 BGM 覆盖，无意外静默
  audio_stability: "pass — 重烧字幕前后成片音频 MD5 逐位一致（c102762e…），仅字幕层变更"
  subtitle_overlap_check: "pass(帧抽检) — 0.6s 仅显示「我们分开吧。」、1.4s 仅显示「你回来啦。」；但时间轴严格核查发现 shot01 丈夫句尾(1.26s)与林晚句头(1.15s)存在 0.11s 同位置(Dialogue)重叠，已随批准终版保留。模板规则 no_two_subtitles_same_position 要求后续集保持 ≥0.2s 间隔"
  sync_check: "pass — 全部 VO 起始与字幕起始误差 ≤0.2s（见 shots[].vo[].abs_start 与 subtitles[].start_s）"
  voice_subtitle_coverage: "pass — 11 条声音均有字幕，15 条字幕均对应声音/排字"
  character_consistency: "pass"
  file_integrity: "pass"
