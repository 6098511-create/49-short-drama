    首帧生成提示词: 9:16竖屏，写实中国生活摄影，暖灰自然光，轻微胶片感，真实皮肤、适度景深，无水印、无乱码。凡林晚入画，必须引用已确认v2及本行指定角色库图片，锁定49岁林晚的脸型、五官比例、眼鼻嘴、发际线和黑色低马尾，不重新设计面孔，不明显年轻化。严格参考SC-C：深棕分格木窗及顶部固定亮子、左侧门洞与旧木桌椅、右侧盖灰米色旧布的矮柜、旧灰白墙和水泥地，窗外为SC-B同一院子；不得更换房间。同一林晚左侧近景，深蓝外套、米白内搭、左肩棕包保持。以SC-C原布局为基准，右主窗延续11向外开约60度，左窗和顶部亮子关闭；她站位与光向延续11，手已自然停下，脸侧局部受光。不得更换窗格或家具。仅写首帧设计，本阶段不生成。
    视频动作提示词: 固定近景。林晚轻轻呼出一口气，肩膀放松，安静望向院子。窗扇保持不动，轻风自然，画内不说话。前一镜旁白之后先留约0.8秒停顿，再配入“是刚刚开始”。最后留环境声。
