    场景: SC-A 同一住宅玄关／手续办妥后
    人物: 林晚
    景别: 中景
    机位: 利用SC-A左后方既有门洞与棕木入户门，室内固定机位朝出门方向
    画面内容: 林晚背好包，拉着一个行李箱搬离。
    人物动作: 门已经打开、拉杆已拉出，她握住拉杆平稳向门外走出画面，不转身。
    人物表情: 平静、克制，不回头大哭。
    对白: 无
    旁白: 无
    环境音: 行李轮声；轻脚步声
    首帧生成提示词: 9:16竖屏，写实中国生活摄影，暖灰自然光，轻微胶片感，真实皮肤、适度景深，无水印、无乱码。凡林晚入画，必须引用已确认v2及本行指定角色库图片，锁定49岁林晚的脸型、五官比例、眼鼻嘴、发际线和黑色低马尾，不重新设计面孔，不明显年轻化。空间严格参考SC-A：长方木桌、白色圆罩吊灯、画面左后方玄关门洞与棕色入户门、右后方餐边柜、右侧窗，家具关系不变。取现有玄关，不另造走廊。林晚穿LW-C01米白针织衫、深灰直筒裤、深棕平底鞋，外加普通深蓝外套LW-C02；一个棕色随身包背在左肩，一个深灰行李箱在右手侧，拉杆已展开，入户门已打开。首帧停在门内，无其他人物。
    视频动作提示词: 固定中景。林晚拉着行李箱向门外缓慢走两步并离开画面，包自然轻晃。不开门、不临时拉起拉杆、不大幅转身，衣服和箱包不变形。
    引用的角色参考图: 01_角色参考图/林晚/林晚_01_固定标准角色图_v2.png；01_角色参考图/林晚/林晚_04_正面全身.png
    引用的场景参考图: 02_场景参考图/婚姻时期住宅/SC-A_01_餐厅全景.png
    生成难度: 中：步态与箱轮
    连续性注意事项: 00:32—00:37。后期时间字幕“手续办妥后”，明确与次日整理钱物有时间间隔，不标具体耗时。07—12同一天，深蓝外套、左肩棕包、右侧灰箱连续。外套为本集服装设计，面部身份仍只认固定角色库。
