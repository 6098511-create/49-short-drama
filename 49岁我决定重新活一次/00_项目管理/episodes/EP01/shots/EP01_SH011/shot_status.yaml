    画面内容: 林晚站到窗边，推开一扇木窗，局部日光更直接进入。
    人物动作: 窗扣预先处于已解开状态；她单手将室内视角右侧主窗扇向院子推出，打开至约60度后停住。
    人物表情: 平静中开始恢复一点主动。
    对白: 无
    旁白: 也许我的人生，不是结束了。
    环境音: 轻微木窗声；轻风进入声
    首帧生成提示词: 9:16竖屏，写实中国生活摄影，暖灰自然光，轻微胶片感，真实皮肤、适度景深，无水印、无乱码。凡林晚入画，必须引用已确认v2及本行指定角色库图片，锁定49岁林晚的脸型、五官比例、眼鼻嘴、发际线和黑色低马尾，不重新设计面孔，不明显年轻化。严格参考SC-C：深棕分格木窗及顶部固定亮子、左侧门洞与旧木桌椅、右侧盖灰米色旧布的矮柜、旧灰白墙和水泥地，窗外为SC-B同一院子；不得更换房间。引用SC-C关闭状态作为布局基准及林晚左45度图。林晚仍穿深蓝外套、背左肩棕包，侧身站窗左侧，首帧窗关闭、窗扣已解开、一只手轻搭室内视角右侧主窗扇的把手。右主窗采用外开设计，铰链在最右边；左主窗和顶部固定亮子保持关闭。不要生成已打开窗的首帧，不增加窗帘或新家具。
    视频动作提示词: 固定侧面中景。林晚用一只手缓慢把右侧主窗扇向窗外院子推出，打开约60度后停住；左窗和上方亮子不动。窗边地面与人物局部稍亮，微风进入，变化自然。不要突然让整屋变亮，不移动家具。
    引用的角色参考图: 01_角色参考图/林晚/林晚_01_固定标准角色图_v2.png；01_角色参考图/林晚/林晚_02_左45度.png；01_角色参考图/林晚/林晚_07_平静.png
    引用的场景参考图: 02_场景参考图/老房子客厅/SC-C_01_客厅未开窗.png；02_场景参考图/老房子外景/SC-B_01_外景.png（窗外院子核对）
    生成难度: 中—高：手窗接触、窗扇几何和采光
    连续性注意事项: 00:53—00:59。分镜明确采用外开窗，保留用户“推开窗”动作；前期档案“内开窗”属于未确认设计，在本表改为外开，待本表确认后统一。仅开右主窗，左窗及顶部亮子不动；箱包不漂移。开窗后状态图尚未保存，本行不引用不存在文件。
