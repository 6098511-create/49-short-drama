    画面内容: 林晚面对破旧屋子，短暂担心今后的生计。
    人物动作: 她停住，左手轻握左肩包带，片刻后缓慢松开，轻轻呼吸。
    人物表情: 短暂害怕、疲惫，随后收住；无哭泣。
    对白: 无
    旁白: 工作还没着落。以后怎么办？
    环境音: 轻呼吸；室内底噪
    首帧生成提示词: 9:16竖屏，写实中国生活摄影，暖灰自然光，轻微胶片感，真实皮肤、适度景深，无水印、无乱码。凡林晚入画，必须引用已确认v2及本行指定角色库图片，锁定49岁林晚的脸型、五官比例、眼鼻嘴、发际线和黑色低马尾，不重新设计面孔，不明显年轻化。严格参考SC-C：深棕分格木窗及顶部固定亮子、左侧门洞与旧木桌椅、右侧盖灰米色旧布的矮柜、旧灰白墙和水泥地，窗外为SC-B同一院子；不得更换房间。林晚深蓝外套、米白内搭、左肩棕包不变。近景中她停在窗前通道，左手已经搭在包带上；背景旧墙或矮柜局部保持原样，灰箱留入口外于镜头边缘之外，窗仍关闭。表情参考疲惫和克制难过，不重新改变面部。
    视频动作提示词: 固定近景。林晚的手轻轻握住包带，停顿一下，再慢慢松开。她静静看屋里，呼吸放缓。画内不说话，旁白后期配入；不要加哭泣或大幅转头。
    引用的角色参考图: 01_角色参考图/林晚/林晚_01_固定标准角色图_v2.png；01_角色参考图/林晚/林晚_06_克制难过.png；01_角色参考图/林晚/林晚_08_疲惫.png
    引用的场景参考图: 02_场景参考图/老房子客厅/SC-C_01_客厅未开窗.png
    生成难度: 低—中：微表情、握包带
    连续性注意事项: 00:48—00:53。害怕来自生计，不添加惊吓或突发电话。箱子仍在入口内，窗仍关闭；声音台词不能因手部动作超时而被压缩成急读。
