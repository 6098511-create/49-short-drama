    首帧生成提示词: 9:16竖屏，写实中国生活摄影，暖灰自然光，轻微胶片感，真实皮肤、适度景深，无水印、无乱码。凡林晚入画，必须引用已确认v2及本行指定角色库图片，锁定49岁林晚的脸型、五官比例、眼鼻嘴、发际线和黑色低马尾，不重新设计面孔，不明显年轻化。空间严格参考SC-A：长方木桌、白色圆罩吊灯、画面左后方玄关门洞与棕色入户门、右后方餐边柜、右侧窗，家具关系不变。次日上午光从同一右侧窗进入。只拍米白针织袖口、腰部和双手中的一只。棕色随身包敞口放桌面右侧，旧钥匙已握在包口上方；后方一个打开的深灰行李箱。蛋糕和协议已经收起。手指正常，不添加银行卡或同时抓多物。
    视频动作提示词: 固定镜头。握着钥匙的手缓慢下移，把钥匙放进已打开的棕色包里，然后手离开包口。另一只手保持不动，不拉拉链，不同时移动行李箱。
