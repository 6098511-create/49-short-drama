    画面内容: 小蛋糕在林晚面前，她抬眼迎向丈夫；白色文件被推到她面前，生日的期待被打断。
    人物动作: 林晚轻轻抬眼；丈夫已在桌边，仅单手将文件沿桌面推至她面前后收手。
    人物表情: 林晚从一点期待变为停顿与错愕，情绪收住。
    对白: 林晚：你回来啦。／丈夫：我们分开吧。
    旁白: 无
    环境音: 开门声作为画外前置声衔接；轻微室内底噪；纸张摩擦声
    首帧生成提示词: 9:16竖屏，写实中国生活摄影，暖灰自然光，轻微胶片感，真实皮肤、适度景深，无水印、无乱码。凡林晚入画，必须引用已确认v2及本行指定角色库图片，锁定49岁林晚的脸型、五官比例、眼鼻嘴、发际线和黑色低马尾，不重新设计面孔，不明显年轻化。空间严格参考SC-A：长方木桌、白色圆罩吊灯、画面左后方玄关门洞与棕色入户门、右后方餐边柜、右侧窗，家具关系不变。生日傍晚；林晚穿米白圆领针织衫和深灰长裤坐在远端。首帧她刚抬眼，蛋糕在距她约20厘米的左前方，单根细蜡烛点燃；右前方留出纸张位置。画面左缘只露丈夫朴素外套袖口及一只手，白色文件尚在推入起点。纸上不生成文字，后期添加离婚协议抬头。
    视频动作提示词: 固定镜头。林晚轻轻抬眼说“你回来啦”，随即丈夫从画外说“我们分开吧”。一只手把文件平缓推向她后收回，她停住。不要同时移动其他道具，不做复杂手部交接。
    引用的角色参考图: 01_角色参考图/林晚/林晚_01_固定标准角色图_v2.png；01_角色参考图/林晚/林晚_05_自然微笑.png；丈夫无已确认图，仅露手臂，正脸不得入画
    引用的场景参考图: 02_场景参考图/婚姻时期住宅/SC-A_01_餐厅全景.png
    生成难度: 中：推纸接触、单手结构和短对白
    连续性注意事项: 00:00—00:06。0—1秒问候，1—2.8秒丈夫提出分开，约第2秒纸到位，前3秒必须完成冲突。门锁声不再增加完整走路进场。蛋糕为EP01可移动道具，开场放在林晚近前；01—04其位置锁定。文件在她右前方。离婚协议文字后期加；丈夫袖口与后续确认造型保持一致。
